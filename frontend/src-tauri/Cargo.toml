[package]
name = "aphelios"
version = "1.0.0"
description = "APHELIOS – Desktop AI Operating System Assistant"
authors = ["NOTNiklas"]
edition = "2021"

# Der Tauri-Build wird auf einem Windows-System mit installiertem Rust
# durchgeführt (`npm run tauri build`). In der Linux-Cloud-Umgebung, in der
# das Grundgerüst erstellt wurde, wird dieser Build nicht ausgeführt.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
